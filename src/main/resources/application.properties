# Local defaults; configure DB_URL, DB_USER and DB_PASSWORD in Render
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.datasource.hikari.maximum-pool-size=5
server.port=${PORT:8080}
